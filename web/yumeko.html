<!doctype html>
<html lang="en">
<head>

<title>Yumeko · Morpheus</title>

<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#0a0614; --panel:#120b24; --raised:#1d1238; --line:#3a2470; --text:#eae6ff; --muted:#9a8fd0; --accent:#b14dff; --accent-ink:#fff;

    background:linear-gradient(180deg, rgba(120,48,150,.92), rgba(62,22,92,.95)); box-shadow:0 0 0 2px #0b0820, inset 0 0 0 2px rgba(255,42,109,.55), 0 0 22px -8px var(--pink); }
  .stylemini { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px; } .stylemini figure { margin:0; width:132px; overflow:hidden; border:2px solid var(--line); border-radius:7px; background:var(--panel); }

  .dlg-name { font:400 16px/1 'Silkscreen', monospace; letter-spacing:.06em; padding:8px 14px 7px; text-shadow:2px 2px 0 #0b0820; }
  .dlg-box { align-self:stretch; display:flex; gap:16px; align-items:flex-start; padding:12px 18px 14px 12px; }
  .dlg-face { flex:none; width:112px; aspect-ratio:1; overflow:hidden; border-radius:4px; background:#0b0820; box-shadow:0 0 0 2px rgba(233,228,255,.5), 0 0 0 4px #0b0820; }
  .dlg-face img { width:100%; height:100%; object-fit:cover; display:block; }

  .dlg.past .dlg-name { display:none; } .dlg.past .dlg-face { width:52px; } .dlg.past .dlg-box { padding:8px 14px 8px 8px; gap:12px; } .dlg.past .dlg-text, .chat .dlg.past .dlg-text { font-size:20px; }

  .pic.pending { aspect-ratio:2/3; border:2px dashed var(--line); background:var(--panel); animation:pendingpulse 1.6s ease-in-out infinite; }
  @keyframes pendingpulse { 50% { opacity:.45; } } @media (prefers-reduced-motion: reduce) { .pic.pending { animation:none; } }
  .gridthree { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }

  .gridthree .pic:first-child { transform-origin:top left; } .gridthree .pic:last-child { transform-origin:top right; }
  .gridthree .pic:not(.pending):hover, .gridthree .pic:focus-visible { z-index:5; transform:scale(1.5); border-color:var(--accent); box-shadow:0 0 34px var(--glow), 0 18px 40px rgba(0,0,0,.7); }
  .gridthree .pic.sel { border-color:var(--accent); box-shadow:0 0 18px var(--glow); }
  .gridthree img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; } .gridthree .bar { padding:6px 9px; font:400 11px/1.2 var(--px); letter-spacing:.04em; }
  .promptlist { margin-top:6px; font-size:13px; } .promptlist summary { cursor:pointer; color:var(--muted); } .promptlist dd { word-break:break-word; }
  @media (max-width:640px) { .gridthree .pic:hover { transform:none; } } @media (prefers-reduced-motion: reduce) { .gridthree .pic { transition:none; } }
  .gridbar { display:flex; align-items:center; gap:12px; min-height:42px; margin-top:8px; }
  #over { width:min(420px,92vw); padding:22px; border:2px solid var(--pink); border-radius:8px; background:var(--panel); color:var(--text); } #over::backdrop { background:rgba(5,3,11,.75); }
  .chat > :first-child { margin-top:auto; }

  .openfull:hover { background:var(--accent); }
  html, body { overflow-x:hidden; }
  body.fixedpage { height:100vh; overflow:hidden; } body.fixedpage main { padding-top:12px; padding-bottom:0; }
  .gridthree { max-width:calc((100vh - 400px) * 2 + 24px); } .promptlist[open] { max-height:150px; overflow-y:auto; }

  .compare { display:grid; grid-template-columns:repeat(3,min(calc((100vh - 245px) * .684), calc((100% - 32px) / 3))); justify-content:center; gap:16px; align-items:start; }

  .baseref figcaption { margin-top:6px; font:400 11px/1.2 var(--px); letter-spacing:.04em; color:var(--muted); text-align:center; }
  @media (max-width:900px) { .compare { grid-template-columns:1fr 1fr; } .compare #b { grid-column:1 / -1; grid-row:2; } .baseref { position:static; } }
  .swipe { min-width:0; text-align:center; } .shot { display:block; width:100%; padding:0; border:2px solid var(--accent); border-radius:8px; overflow:hidden; background:var(--panel); cursor:zoom-in; box-shadow:0 0 18px var(--glow); }
  .shot img { display:block; width:100%; height:auto; } .shotbox { position:relative; }

  .nope { color:#ff6b81; border-color:#ff6b81; } .love { color:#ff3d9a; border-color:#ff3d9a; } .nope:hover { background:#ff6b81; color:#fff; } .love:hover { background:#ff3d9a; color:#fff; }

  .settrack i { position:absolute; inset:0 auto 0 0; background:var(--accent); opacity:.35; } .settrack span, .settrack b { position:relative; font-weight:400; white-space:nowrap; } .settrack span { overflow:hidden; text-overflow:ellipsis; }

// Pills write their tags visibly: [positive, negative] go into / come out of the Quality and Negative fields.
function pillTags(f, pair, on) {
  if (!pair) return;
  const split = s => (s || '').split(',').map(t => t.trim()).filter(Boolean);
  [['quality', pair[0]], ['negative', pair[1]]].forEach(([key, tags]) => {
    const add = split(tags); if (!add.length) return;
    const have = split(f[key]).filter(t => !add.includes(t));
    f[key] = (on ? [...have, ...add] : have).join(', ');
  });
}
// Fresh form (or Default button: only = 0 quality, 1 negative): add the tags of every pill that is on.
function pillsFill(j, f, only) {
  const p = j.defaults.pill_tags; if (!p) return;
  const keep = only === undefined ? null : only ? 'negative' : 'quality', save = keep && { ...f };
  if (f.identity !== false) pillTags(f, p.identity, true);
  if ((j.defaults.trained_options || []).some(t => f.trained.split(', ').includes(t))) pillTags(f, p.outfit, true);
  if (keep) Object.keys(save).forEach(k => { if (k !== keep && (k === 'quality' || k === 'negative')) f[k] = save[k]; });
}

// Prefill the Use form with a rendered picture's prompt, seed and settings.
function fillUse(j, g) {
  const f = job.form ||= { prompt:'', block:true, identity:true, trained:j.defaults.trained ?? '', quality:j.defaults.quality, negative:j.defaults.negative, seed:'', size:'832,1216', strength:j.lora?.strength ?? 1 }; f.pilled = true;

// Gallery: every Use render as minis; a viewer with prev/next, and a fullscreen slideshow in shuffled order.
function galleryView(el) {

  box.querySelector('.x').onclick = end; box.onclick = e => { if (e.target !== box.querySelector('.x')) next(); };

// ---------- Create Manga ----------
async function manga() {
  clearTimeout(timer); const m = await get('/api/yumeko/manga');
  app.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Create Manga</h2><button class="go" id="new">New panel</button></div><div class="grid" id="ps"></div>
    ${m.panels.length ? '' : '<p class="note">No panels yet. Start one; characters come from finished sets.</p>'}`;
  $('new').onclick = async () => { const p = await act('panel_new', {}); if (p) location.hash = 'panel/' + p.id; };
  m.panels.forEach(p => { const b = document.createElement('button'); b.className = 'tile'; const f = p.versions[0]?.file;
    b.innerHTML = `${f ? `<img src="${file('_manga/' + p.id, f)}" alt="">` : '<span class="blank">▦</span>'}<span class="meta"><b>${esc(p.title)}</b></span>`; b.onclick = () => location.hash = 'panel/' + p.id; $('ps').append(b); });
}
async function openPanel(id) { clearTimeout(timer); const m = await get('/api/yumeko/manga'); panel = await get('/api/yumeko/panel/' + id); panel._loras = m.loras; drawn = {}; tool.active = panel.characters[0]?.id ?? null; paintPanel(); pollPanel(); }
function pollPanel() { clearTimeout(timer); timer = setTimeout(async () => { if (!location.hash.includes(panel?.id)) return; const b = panel.busy, n = panel.versions.length, l = panel._loras;
  panel = await get('/api/yumeko/panel/' + panel.id); panel._loras = l; if (b !== panel.busy || n !== panel.versions.length) { const keep = captureMasks(); paintPanel(); restoreMasks(keep); } pollPanel(); }, 2000); }
const dir = () => '_manga/' + panel.id;
async function savePanel() { const { _loras, ...p } = panel; const r = await act('panel_edit', { id:p.id, title:p.title, tags:p.tags, prompt:p.prompt, negative:p.negative, characters:p.characters, width:p.width, height:p.height }); return r; }
function captureMasks() { return drawn; } function restoreMasks() { showMask(); }
function paintPanel() {
  const p = panel, top = p.versions[0];
  app.innerHTML = `<div class="row" style="margin-bottom:10px"><input id="title" value="${esc(p.title)}" aria-label="Panel title" style="flex:1"><button class="danger" id="delp">Delete panel</button></div>
    ${p.busy ? `<p class="busy">${esc(p.busy)} …</p>` : ''}${p.error ? `<p class="err">${esc(p.error)}</p>` : ''}
    <div class="two"><div>${top ? `<div class="stage" id="stage"><img id="pic" src="${file(dir(), top.file)}" alt="Panel"><canvas id="cv"></canvas></div>
      <div class="row" style="margin:8px 0"><label class="note">Brush</label><input id="size" type="range" min="6" max="140" value="${tool.size}" style="width:140px;padding:0"><button id="erase" aria-pressed="${tool.erase}">${tool.erase ? 'Erasing' : 'Erase'}</button><button id="clear">Clear mask</button><button id="savem">Save masks</button></div>
      <h3>Versions</h3><div class="versions" id="vs"></div>` : '<p class="note">Write the scene, then render a composition. Describe each person in words: hair and outfit colours help her mask pass a lot.</p>'}</div>
    <div><h3>Scene</h3><label class="note">Tags, canonical spelling</label><div class="sugg"><textarea id="tags" rows="2" placeholder="2girls, sitting, indoors, night, wide_shot">${esc(p.tags)}</textarea></div>
      <label class="note">Prompt, natural language</label><textarea id="prompt" rows="4" placeholder="manga panel, cyber cafe. On the left a woman with black hair, on the right a woman with white hair.">${esc(p.prompt)}</textarea>
      <label class="note">Negative</label><input id="neg" value="${esc(p.negative)}" placeholder="text, letters, speech_bubble, watermark, signature">

function setupPainter() {
  const img = $('pic'), cv = $('cv');
  const ready = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; showMask(); };
  img.complete ? ready() : img.onload = ready;
  let down = false, last = null;
  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  const stroke = e => { const m = maskOf(tool.active); if (!m) return; const c = m.getContext('2d'), [x, y] = at(e); c.globalCompositeOperation = tool.erase ? 'destination-out' : 'source-over'; c.strokeStyle = c.fillStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = tool.size * cv.width / cv.getBoundingClientRect().width;
    c.beginPath(); c.moveTo(...(last || [x, y])); c.lineTo(x, y); c.stroke(); last = [x, y]; showMask(); };
  cv.onpointerdown = e => { if (!tool.active) return; down = true; last = null; cv.setPointerCapture(e.pointerId); stroke(e); };
  cv.onpointermove = e => { if (down) stroke(e); };
  cv.onpointerup = () => { down = false; };
  $('size').oninput = e => tool.size = +e.target.value;
  $('erase').onclick = () => { tool.erase = !tool.erase; $('erase').textContent = tool.erase ? 'Erasing' : 'Erase'; $('erase').setAttribute('aria-pressed', tool.erase); };
  $('clear').onclick = () => { const m = maskOf(tool.active); m?.getContext('2d').clearRect(0, 0, m.width, m.height); showMask(); };
  $('savem').onclick = saveMasks;
  const vs = $('vs'); panel.versions.forEach(v => { const b = document.createElement('button'); b.title = 'Make this the newest version to paint on'; b.innerHTML = `<img src="${file(dir(), v.file)}" alt=""><span>${esc(v.label)}</span>`; b.onclick = () => { panel.versions = [v, ...panel.versions.filter(x => x !== v)]; savePanel(); paintPanel(); }; vs.append(b); });
}
function maskOf(id) { if (!id || !$('cv')) return null; if (!drawn[id]) { const c = document.createElement('canvas'); c.width = $('cv').width; c.height = $('cv').height; drawn[id] = c;
    const c0 = panel.characters.find(x => x.id === id); if (c0?.masked) { const im = new Image(); im.onload = () => { const t = document.createElement('canvas'); t.width = c.width; t.height = c.height; const g = t.getContext('2d'); g.drawImage(im, 0, 0, c.width, c.height); const d = g.getImageData(0, 0, c.width, c.height); for (let i = 0; i < d.data.length; i += 4) { d.data[i + 3] = d.data[i]; d.data[i] = d.data[i + 1] = d.data[i + 2] = 255; } c.getContext('2d').putImageData(d, 0, 0); showMask(); }; im.src = file(dir(), `mask_${id}.png`) + '?' + Date.now(); } }

async function route() { const h = location.hash.slice(1); document.body.classList.remove('fixedpage'); if (parent !== window) parent.postMessage({ yumekoView:h.startsWith('manga') || h.startsWith('panel') ? 'manga' : '' }, location.origin); $('nav-sets').toggleAttribute('aria-current', !h.startsWith('manga') && !h.startsWith('panel')); $('nav-manga').toggleAttribute('aria-current', h.startsWith('manga') || h.startsWith('panel'));

  try { if (h === 'new') await newSet(); else if (h.startsWith('job/')) await openJob(h.slice(4)); else if (h === 'manga') await manga(); else if (h.startsWith('panel/')) await openPanel(h.slice(6)); else await home(); }
