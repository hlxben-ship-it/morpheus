<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumeko · Morpheus</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#15132b; --panel:#1e1b3a; --raised:#2a2652; --line:#383363; --text:#f6ebdd; --muted:#a79fc4; --accent:#d8384f; --accent-ink:#fff; --ok:#6fd0a0; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 14px/1.55 "IBM Plex Mono",ui-monospace,monospace; }
  a { color:inherit; }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:7px 13px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.go { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.danger { color:#ff9aa8; }
  input[type=range] { accent-color:var(--accent); }
  input, textarea, select { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:16px; letter-spacing:.02em; }
  .views { display:flex; padding:3px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .views a { padding:5px 12px; border-radius:7px; color:var(--muted); font-size:14px; text-decoration:none; }
  .views a:hover { color:var(--text); }
  .views a[aria-current] { background:var(--accent); color:var(--accent-ink); }
  main { max-width:1500px; margin:0 auto; padding:18px 16px; }
  .head { display:flex; gap:16px; align-items:center; margin-bottom:22px; }
  .head img { width:96px; height:96px; border-radius:50%; border:2px solid var(--accent); object-fit:cover; flex:none; }
  .say { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; max-width:70ch; min-height:48px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,200px)); gap:14px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; text-align:left; padding:0; }
  .tile img, .tile .blank { width:100%; aspect-ratio:2/3; object-fit:cover; display:grid; place-items:center; color:var(--muted); background:var(--raised); font-size:42px; }
  .tile .meta { padding:9px 11px; display:flex; flex-direction:column; gap:6px; }
  .tile .row { display:flex; gap:6px; align-items:center; justify-content:space-between; }
  .tile small { color:var(--muted); }
  .steps { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; padding:0; list-style:none; }
  .steps li { padding:4px 11px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12.5px; }
  .steps li.on { border-color:var(--accent); color:var(--text); }
  .steps li.done { color:var(--ok); }
  .two { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; }
  @media (max-width:860px) { .two { grid-template-columns:1fr; } }
  .pics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .pics.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
  @media (max-width:640px) { .pics, .pics.four { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .pic { position:relative; background:var(--panel); border:2px solid var(--line); border-radius:10px; overflow:hidden; padding:0; display:block; width:100%; }
  .pic img { width:100%; display:block; }
  .pic.keep { border-color:var(--ok); } .pic.drop { opacity:.45; } .pic.sel { border-color:var(--accent); }
  .pic .bar { display:flex; gap:6px; padding:6px; }
  .pic .bar button { flex:1; padding:4px 6px; }
  .pic .tags { width:100%; border:0; border-top:1px solid var(--line); border-radius:0; font-size:11.5px; min-height:50px; resize:vertical; }
  .chat { display:flex; flex-direction:column; gap:8px; max-height:420px; overflow:auto; margin-bottom:10px; }
  .chat p { margin:0; padding:8px 11px; border-radius:10px; background:var(--panel); }
  .chat p.user { background:var(--raised); align-self:flex-end; max-width:90%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .note { color:var(--muted); font-size:12.5px; }
  .err { color:#ff9aa8; margin:8px 0; }
  .busy { color:var(--accent); margin:8px 0; }
  .meter { height:10px; border-radius:6px; background:var(--raised); overflow:hidden; margin:8px 0; }
  .meter i { display:block; height:100%; background:var(--accent); }
  .bal { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:2px 14px; font-size:12px; color:var(--muted); }
  .sugg { position:relative; }
  .sugg ul { position:absolute; z-index:4; left:0; right:0; margin:2px 0 0; padding:4px; list-style:none; background:var(--raised); border:1px solid var(--line); border-radius:8px; max-height:220px; overflow:auto; }
  .sugg li { padding:4px 8px; cursor:pointer; border-radius:6px; } .sugg li:hover { background:var(--panel); }
  .jobtop { display:flex; gap:14px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .jobtop img { width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:top; border:2px solid var(--accent); flex:none; }
  .jobtop h2 { margin:0; } .jobtop .steps { margin:0 0 0 auto; } .jobtop .say { padding:7px 12px; min-height:0; flex:1 1 260px; font-size:13px; }
  .steps li { padding:0; border:0; } .steps button { padding:4px 11px; border-radius:999px; font-size:12.5px; background:transparent; color:var(--muted); }
  .steps li.done button { color:var(--ok); } .steps li.now button { border-color:var(--accent); color:var(--text); }
  .steps li.on button { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .review { display:grid; grid-template-columns:minmax(260px,420px) minmax(0,1fr); gap:22px; }
  .review img { width:100%; border-radius:10px; display:block; }
  @media (max-width:860px) { .review { grid-template-columns:1fr; } }
  .exact { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; white-space:pre-wrap; word-break:break-word; font-size:12.5px; margin:0 0 4px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:12.5px; margin:0 0 12px; } .kv dt { color:var(--muted); } .kv dd { margin:0; }
  dialog.lb { width:100vw; height:100vh; max-width:none; max-height:none; border:0; padding:16px; background:rgba(8,6,20,.94); color:var(--text); }
  dialog.lb[open] { display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-rows:minmax(0,1fr) auto; gap:10px 14px; align-items:center; }
  dialog.lb img { width:100%; height:100%; min-height:0; object-fit:contain; display:block; }
  dialog.lb .nav { width:48px; height:72px; font-size:24px; padding:0; } dialog.lb p { grid-column:1 / 4; margin:0; text-align:center; font-size:12.5px; color:var(--muted); }
  dialog.lb .x { position:absolute; top:12px; right:16px; }
  .groups { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; padding:0; list-style:none; }
  .groups li { padding:3px 10px; border:1px solid var(--line); border-radius:999px; font-size:12.5px; color:var(--muted); }
  .groups li.done { color:var(--ok); } .groups li.now { border-color:var(--accent); color:var(--text); } .groups li.off { opacity:.45; text-decoration:line-through; }
  .plan { display:grid; gap:8px; margin-top:8px; } .plan label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:3px; }
  .plan .o { display:grid; grid-template-columns:190px minmax(0,1fr); gap:10px; align-items:center; } .plan .o label { margin:0; color:var(--text); display:flex; align-items:center; gap:8px; } .plan .o input[type=checkbox] { width:auto; flex:none; margin:0; }
  @media (max-width:640px) { .plan .o { grid-template-columns:1fr; } }
  .promptbox { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr); gap:12px; align-items:stretch; }
  .tagsearch { display:flex; flex-direction:column; gap:4px; min-height:0; } .tagsearch ul { list-style:none; margin:0; padding:0; height:78px; overflow-y:auto; }
  .tagsearch li button { width:100%; display:flex; gap:8px; justify-content:space-between; padding:3px 7px; border:0; border-radius:5px; background:none; font-size:12.5px; text-align:left; }
  .tagsearch li button:hover { background:var(--raised); } .tagsearch small { color:var(--muted); white-space:nowrap; }
  .kinds { display:flex; flex-wrap:wrap; gap:4px; } .kinds button { padding:1px 8px; border-radius:999px; font-size:11.5px; color:var(--muted); background:none; }
  .kinds button[aria-pressed=true] { background:var(--raised); border-color:var(--accent); color:var(--text); }
  @media (max-width:640px) { .promptbox { grid-template-columns:1fr; } }
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .gal figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .gal img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; } .gal figcaption { padding:6px 8px; font-size:11.5px; color:var(--muted); }
  .form label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:3px; } .form .always { font-size:11.5px; color:var(--muted); }
  .form { overflow-y:auto; padding-right:4px; }
  .use { display:grid; grid-template-columns:minmax(280px,32%) minmax(0,1fr); gap:20px; height:calc(100vh - 170px); min-height:520px; }
  .viewer { display:flex; flex-direction:column; min-height:0; gap:8px; }
  .viewer .big { flex:1; min-height:0; display:grid; place-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .viewer .big img { width:100%; height:100%; object-fit:contain; display:block; }
  .strip { display:flex; gap:8px; overflow-x:auto; flex:none; padding-bottom:4px; }
  .strip button { padding:0; width:66px; height:96px; flex:none; overflow:hidden; border-width:2px; }
  .strip button[aria-current=true] { border-color:var(--accent); } .strip img { width:100%; height:100%; object-fit:cover; display:block; }
  .side { display:flex; flex-direction:column; gap:10px; }
  @media (max-width:860px) { .use { grid-template-columns:1fr; height:auto; } .viewer .big { height:60vh; } }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; }
  .thumbs img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:6px; display:block; }
  .trainbox { display:grid; grid-template-columns:220px minmax(0,1fr); gap:20px; }
  .trainbox > img { width:100%; border-radius:10px; }
  @media (max-width:760px) { .trainbox { grid-template-columns:1fr; } }
  h2 { font-size:18px; margin:0 0 12px; }
  h3 { font-size:14px; margin:16px 0 8px; }
  .stage { position:relative; display:inline-block; max-width:100%; line-height:0; }
  .stage img { max-width:100%; display:block; max-height:72vh; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; touch-action:none; opacity:.55; }
  .char { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  .char.on { border-color:var(--accent); }
  .dot { width:14px; height:14px; border-radius:50%; display:inline-block; }
  .versions { display:flex; gap:8px; overflow-x:auto; padding:6px 0; }
  .versions button { padding:0; width:92px; flex:none; overflow:hidden; font-size:11px; }
  .versions img { width:100%; display:block; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; max-width:440px; }
  dialog::backdrop { background:rgba(5,3,20,.6); }
</style>
</head>
<body>
<header>
  <nav class="views" aria-label="Yumeko views">
    <a href="#" id="nav-sets">Sets</a><a href="#manga" id="nav-manga">Create Manga</a>
  </nav>
</header>
<main id="app"></main>
<dialog id="del"><p id="del-text"></p><input id="del-name" aria-label="Agent name"><div class="row" style="margin-top:12px"><button id="del-go" class="danger">Delete for good</button><button id="del-no">Keep it</button></div></dialog>
<script>
const $ = id => document.getElementById(id), app = $('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const file = (dir, f) => `/yumeko-file/${dir}/${encodeURIComponent(f)}`;
const get = async u => { const r = await fetch(u), j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Request failed'); return j; };
const post = async (a, b) => { const r = await fetch('/api/yumeko/' + a, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(b) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Request failed'); return j; };
let timer, catalog, S, job, panel, tool = { active:null, size:36, erase:false }, drawn = {};
const PHASES = ['Base image', 'Second base', 'Training set', 'Training', 'Use', ];
const COLORS = ['#ff4060', '#40a0ff', '#50e090', '#ffc040'];
function fail(e) { const n = document.createElement('p'); n.className = 'err'; n.textContent = e.message; app.prepend(n); setTimeout(() => n.remove(), 7000); }
const act = async (a, b) => { try { const r = await post(a, b); return r; } catch (e) { fail(e); } };

// ---------- home ----------
async function home() {
  clearTimeout(timer); S = await get('/api/yumeko/state');
  app.innerHTML = `<div class="head"><img src="/yumeko-head.png" alt="Yumeko"><div class="say" id="say" aria-live="polite"></div></div>
    <div class="grid" id="sets"></div>`;
  const say = $('say'); let i = 0; (function type() { if (i <= S.greeting.length) { say.textContent = S.greeting.slice(0, i++); setTimeout(type, 16); } })();
  const g = $('sets'), add = document.createElement('button');
  add.className = 'tile'; add.innerHTML = '<span class="blank">+</span><span class="meta"><b>Add</b><small>New set</small></span>'; add.onclick = () => location.hash = 'new'; g.append(add);
  S.jobs.forEach(j => {
    const t = document.createElement('div'); t.className = 'tile'; t.tabIndex = 0;
    t.innerHTML = `${j.cover ? `<img src="${file(j.id, j.cover)}" alt="">` : '<span class="blank">?</span>'}<div class="meta"><b>${esc(j.agent)}</b>
      <small>${j.finished ? 'Finished' : `In progress, ${PHASES[j.phase - 1]}`}${j.phase === 3 ? `, ${j.accepted} kept` : ''}</small>
      <div class="row"><button data-a="star" aria-label="Favourite">${j.star ? '★' : '☆'}</button><button data-a="del" class="danger">Delete</button></div></div>`;
    t.onclick = e => { const a = e.target.dataset.a;
      if (a === 'star') act('star', { id:j.id }).then(home);
      else if (a === 'del') askDelete(j);
      else location.hash = 'job/' + j.id; };
    t.onkeydown = e => { if (e.key === 'Enter') location.hash = 'job/' + j.id; };
    g.append(t);
  });
}
function askDelete(j) {
  $('del-text').textContent = `This removes ${j.agent}'s job folder with every picture, the training set and the trained LoRA. It can't be undone. Type ${j.agent} to confirm.`;
  $('del-name').value = ''; $('del').showModal();
  $('del-no').onclick = () => $('del').close();
  $('del-go').onclick = async () => { const r = await act('delete', { id:j.id, confirm:$('del-name').value }); $('del').close(); if (r) home(); };
}
async function newSet() {
  clearTimeout(timer); S = await get('/api/yumeko/state');
  app.innerHTML = `<h2>From scratch</h2><form class="row" id="fresh" style="margin-bottom:22px"><input id="fresh-name" aria-label="Character name" placeholder="Character name" maxlength="40" required style="flex:0 1 280px"><button class="go">Start building</button></form>
    <h2>Or from an agent</h2><div class="grid" id="ag"></div>`;
  $('fresh').onsubmit = async e => { e.preventDefault(); const j = await act('create', { name:$('fresh-name').value }); if (j) location.hash = 'job/' + j.id; };
  S.agents.forEach(a => { const b = document.createElement('button'); b.className = 'tile';
    b.innerHTML = `<img src="/agents/${a.id}/portrait.png" alt="" onerror="this.style.display='none'"><span class="meta"><b>${esc(a.name)}</b><small>${esc(a.title)}</small></span>`;
    b.onclick = async () => { const j = await act('create', { agent:a.id }); if (j) location.hash = 'job/' + j.id; }; $('ag').append(b); });
}

// ---------- job ----------
async function openJob(id) { clearTimeout(timer); job = await get('/api/yumeko/job/' + id); paintJob(); poll(); }
function poll() { clearTimeout(timer); timer = setTimeout(async () => {
  if (!location.hash.includes(job?.id)) return;
  const before = JSON.stringify([job.busy, job.phase, job.train?.step, job.dataset.batch.length, job.phase1.grid.length, job.phase2.grid.length, job.phase1.chat.length, job.stage_tests, job.gallery.length]);
  const { tab, form, viewing, tagQuery, chatDraft } = job; job = { ...await get('/api/yumeko/job/' + job.id), tab, form, viewing, tagQuery, chatDraft };
  if (before !== JSON.stringify([job.busy, job.phase, job.train?.step, job.dataset.batch.length, job.phase1.grid.length, job.phase2.grid.length, job.phase1.chat.length, job.stage_tests, job.gallery.length])) paintJob();
  poll(); }, 2000); }
const refresh = r => { if (r && r.id) { const { defaults, sent, balance } = job; job = { ...job, ...r, defaults, sent, balance }; paintJob(); } };
function paintJob() {
  const j = job, n = j.phase, tab = Math.min(j.tab || n, n);
  const line = j.busy ? `${j.busy} …` : { 1:'Tell me who she is. I will pretend it was my idea.', 2:'Your turn. I am on break.', 3:'Keep the good ones. Tiny flaws get learned too.', 4:'She is training. I am supervising, horizontally.', 5:j.lora ? 'Done. Try not to look surprised.' : 'Pick the stage that looks most like her.' }[n];
  app.innerHTML = `<div class="jobtop"><img src="/yumeko-head.png" alt="Yumeko"><h2>${esc(j.agent.name)}</h2><div class="say">${esc(line)}</div><ol class="steps">${PHASES.map((p, i) => `<li class="${i + 1 === tab ? 'on' : ''} ${i + 1 === n ? 'now' : i + 1 < n ? 'done' : ''}"><button data-tab="${i + 1}" ${i + 1 > n ? 'disabled' : ''}>${i + 1}. ${p}</button></li>`).join('')}</ol></div>
    ${j.error ? `<p class="err">${esc(j.error)}</p>` : ''}<div id="ph"></div>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { job.tab = +b.dataset.tab; paintJob(); });
  if (tab < n) ({ 1:r => review(r, 0), 2:r => review(r, 1), 3:reviewSet, 4:reviewTrain }[tab])($('ph'));
  else ({ 1:p1, 2:p2, 3:p3, 4:p4, 5:p5 }[n])($('ph'));
}
function lightbox(items, start) {
  let i = start; const d = document.createElement('dialog'); d.className = 'lb'; d.setAttribute('aria-label', 'Training picture');
  d.innerHTML = '<button class="nav" aria-label="Previous picture">‹</button><img alt=""><button class="nav" aria-label="Next picture">›</button><p></p><button class="x">Close</button>';
  const [prev, next] = d.querySelectorAll('.nav'), img = d.querySelector('img'), cap = d.querySelector('p');
  const show = n => { i = (n + items.length) % items.length; img.src = items[i].src; cap.textContent = `${i + 1} of ${items.length}: ${items[i].caption}`; };
  prev.onclick = () => show(i - 1); next.onclick = () => show(i + 1); d.querySelector('.x').onclick = () => d.close();
  d.onclick = e => { if (e.target === d) d.close(); };
  d.onkeydown = e => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); };
  d.onclose = () => d.remove();
  document.body.append(d); show(i); d.showModal();
}
document.addEventListener('click', e => {
  const a = e.target.closest('.gal a'); if (!a) return; e.preventDefault();
  const links = [...a.closest('.gal').querySelectorAll('a')];
  lightbox(links.map(l => ({ src:l.href, caption:l.parentElement.querySelector('figcaption').textContent })), links.indexOf(a));
});
function outfitLine(tags) {
  const worn = (tags || []).filter(t => t.role === 'outfit').map(t => t.tag.replace(/_/g, ' '));
  return worn.length ? `<p class="note"><b>Signature outfit:</b> ${esc(worn.join(', '))}</p>` : '';
}
let tagKinds = ['general'];
function tagBox() { return `<div class="tagsearch"><label for="ts">Danbooru tags</label><input id="ts" type="search" placeholder="Search, click to add" value="${esc(job.tagQuery || '')}"><div class="kinds" id="tk"></div><ul id="tr"></ul></div>`; }
function tagSearch(fields, onAdd) {
  let target = Object.keys(fields)[0], wait;
  Object.keys(fields).forEach(id => $(id).addEventListener('focus', () => target = id));  // a tag lands in the field used last
  const used = () => Object.keys(fields).flatMap(id => $(id).value.split(',').map(t => t.trim().toLowerCase()));
  const show = tags => { $('tr').innerHTML = ''; const taken = used(); tags.filter(t => !taken.includes(t.tag.replace(/_/g, ' '))).forEach(t => { const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.innerHTML = `<span>${esc(t.tag.replace(/_/g, ' '))}</span><small>${t.kind === 'general' ? '' : esc(t.kind) + ', '}${t.count.toLocaleString('en')}</small>`;
    b.onclick = () => { const v = $(target).value.trim().replace(/,$/, ''), next = (v ? v + ', ' : '') + t.tag.replace(/_/g, ' ') + ', ';
      $(target).value = next; onAdd?.(fields[target], next); li.remove(); };
    li.append(b); $('tr').append(li); }); };
  const find = async () => { job.tagQuery = $('ts').value; try { show((await get('/api/yumeko/tags?q=' + encodeURIComponent(job.tagQuery) + '&kinds=' + tagKinds.join(','))).tags); } catch { show([]); } };

  $('delp').onclick = async () => { if (confirm('Delete this panel and its versions?')) { await act('panel_delete', { id:p.id }); location.hash = 'manga'; } };
  ['tags', 'prompt'].forEach(k => $(k).onchange = e => { p[k] = e.target.value; savePanel(); }); $('neg').onchange = e => { p.negative = e.target.value; savePanel(); };
  autocomplete($('tags'));
  $('size-p').value = `${p.width},${p.height}`; $('size-p').onchange = e => { [p.width, p.height] = e.target.value.split(',').map(Number); savePanel(); };
  const compose = t => async () => { p.tags = $('tags').value; p.prompt = $('prompt').value; p.negative = $('neg').value; await savePanel(); const r = await act('panel_compose', { id:p.id, together:t }); if (r) { Object.assign(panel, r); paintPanel(); } };
  $('comp').onclick = compose(false); $('tog').onclick = compose(true);
  $('add').onchange = e => { const l = p._loras.find(x => x.id === e.target.value); if (!l) return; p.characters.push({ id:`c${Date.now()}`, name:l.name, trigger:l.trigger, file:l.file, strength:l.strength, denoise:.62, action:'' }); tool.active = p.characters.at(-1).id; savePanel(); paintPanel(); };
  p.characters.forEach((c, i) => { const w = document.createElement('div'); w.className = 'char' + (tool.active === c.id ? ' on' : '');
    w.innerHTML = `<div class="row"><span class="dot" style="background:${COLORS[i % 4]}"></span><b style="flex:1">${esc(c.name)}</b><span class="note">${c.masked ? 'mask saved' : 'no mask'}</span><button data-r>Remove</button></div>
      <input data-action placeholder="What she does here" value="${esc(c.action)}" style="margin:6px 0">
      <label class="note">LoRA ${c.strength}</label><input data-str type="range" min=".3" max="1.3" step=".05" value="${c.strength}" style="padding:0">
      <label class="note">Change ${c.denoise}</label><input data-den type="range" min=".3" max=".95" step=".01" value="${c.denoise}" style="padding:0">
      <div class="row" style="margin-top:6px"><button data-p>Paint mask</button><button data-pass ${p.busy ? 'disabled' : ''}>Redo this pass</button></div>`;
    w.querySelector('[data-p]').onclick = () => { tool.active = c.id; paintPanel(); };
    w.querySelector('[data-r]').onclick = () => { p.characters.splice(i, 1); savePanel(); paintPanel(); };
    w.querySelector('[data-action]').onchange = e => { c.action = e.target.value; savePanel(); };
    w.querySelector('[data-str]').onchange = e => { c.strength = +e.target.value; savePanel(); paintPanel(); };
    w.querySelector('[data-den]').onchange = e => { c.denoise = +e.target.value; savePanel(); paintPanel(); };
    w.querySelector('[data-pass]').onclick = async () => { await saveMasks(); const r = await act('panel_pass', { id:p.id, character:c.id, from:p.versions[0].file }); if (r) { Object.assign(panel, r); paintPanel(); } };
    $('chars').append(w); });
  $('all').onclick = async () => { await saveMasks(); const comp = p.composition; const r = await act('panel_pass', { id:p.id, all:true, from:comp }); if (r) { Object.assign(panel, r); paintPanel(); } };
  if (top) setupPainter();
}
function setupPainter() {
  const img = $('pic'), cv = $('cv');
  const ready = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; showMask(); };
  img.complete ? ready() : img.onload = ready;
  let down = false, last = null;
  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  const stroke = e => { const m = maskOf(tool.active); if (!m) return; const c = m.getContext('2d'), [x, y] = at(e); c.globalCompositeOperation = tool.erase ? 'destination-out' : 'source-over'; c.strokeStyle = c.fillStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = tool.size * cv.width / cv.getBoundingClientRect().width;
    c.beginPath(); c.moveTo(...(last || [x, y])); c.lineTo(x, y); c.stroke(); last = [x, y]; showMask(); };
  cv.onpointerdown = e => { if (!tool.active) return; down = true; last = null; cv.setPointerCapture(e.pointerId); stroke(e); };
  cv.onpointermove = e => { if (down) stroke(e); };
  cv.onpointerup = () => { down = false; };
  $('size').oninput = e => tool.size = +e.target.value;
  $('erase').onclick = () => { tool.erase = !tool.erase; $('erase').textContent = tool.erase ? 'Erasing' : 'Erase'; $('erase').setAttribute('aria-pressed', tool.erase); };
  $('clear').onclick = () => { const m = maskOf(tool.active); m?.getContext('2d').clearRect(0, 0, m.width, m.height); showMask(); };
  $('savem').onclick = saveMasks;
  const vs = $('vs'); panel.versions.forEach(v => { const b = document.createElement('button'); b.title = 'Make this the newest version to paint on'; b.innerHTML = `<img src="${file(dir(), v.file)}" alt=""><span>${esc(v.label)}</span>`; b.onclick = () => { panel.versions = [v, ...panel.versions.filter(x => x !== v)]; savePanel(); paintPanel(); }; vs.append(b); });
}
function maskOf(id) { if (!id || !$('cv')) return null; if (!drawn[id]) { const c = document.createElement('canvas'); c.width = $('cv').width; c.height = $('cv').height; drawn[id] = c;
    const c0 = panel.characters.find(x => x.id === id); if (c0?.masked) { const im = new Image(); im.onload = () => { const t = document.createElement('canvas'); t.width = c.width; t.height = c.height; const g = t.getContext('2d'); g.drawImage(im, 0, 0, c.width, c.height); const d = g.getImageData(0, 0, c.width, c.height); for (let i = 0; i < d.data.length; i += 4) { d.data[i + 3] = d.data[i]; d.data[i] = d.data[i + 1] = d.data[i + 2] = 255; } c.getContext('2d').putImageData(d, 0, 0); showMask(); }; im.src = file(dir(), `mask_${id}.png`) + '?' + Date.now(); } }
  return drawn[id]; }
function showMask() { const cv = $('cv'); if (!cv) return; const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  panel.characters.forEach((ch, i) => { const m = maskOf(ch.id); if (!m) return; const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; const g = t.getContext('2d'); g.drawImage(m, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = COLORS[i % 4]; g.fillRect(0, 0, t.width, t.height); c.drawImage(t, 0, 0); }); }
async function saveMasks() { for (const ch of panel.characters) { const m = drawn[ch.id]; if (!m) continue; const t = document.createElement('canvas'); t.width = m.width; t.height = m.height; const g = t.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, t.width, t.height); g.drawImage(m, 0, 0); if (!m.getContext('2d').getImageData(0, 0, m.width, m.height).data.some((v, i) => i % 4 === 3 && v)) continue;
    const r = await act('panel_mask', { id:panel.id, character:ch.id, mask:t.toDataURL('image/png') }); if (r) ch.masked = true; } }

// ---------- routes ----------
async function route() { const h = location.hash.slice(1); $('nav-sets').toggleAttribute('aria-current', !h.startsWith('manga') && !h.startsWith('panel')); $('nav-manga').toggleAttribute('aria-current', h.startsWith('manga') || h.startsWith('panel'));
  catalog ||= await get('/api/yumeko/catalog');
  try { if (h === 'new') await newSet(); else if (h.startsWith('job/')) await openJob(h.slice(4)); else if (h === 'manga') await manga(); else if (h.startsWith('panel/')) await openPanel(h.slice(6)); else await home(); }
  catch (e) { app.innerHTML = ''; fail(e); } }
addEventListener('hashchange', route); route();
</script>
