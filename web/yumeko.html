<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumeko · Morpheus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#0a0614; --panel:#120b24; --raised:#1d1238; --line:#3a2470; --text:#eae6ff; --muted:#9a8fd0; --accent:#b14dff; --accent-ink:#fff;
    --pink:#ff2a6d; --cyan:#2de2e6; --ok:#2de2e6; --glass:rgba(18,11,36,.78); --glow:rgba(177,77,255,.4); --px:'Silkscreen',monospace; --term:'VT323',monospace; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); font:400 14.5px/1.55 Inter,system-ui,sans-serif;
    background:radial-gradient(900px 500px at 85% -10%, rgba(177,77,255,.28), transparent 60%), radial-gradient(700px 420px at 0% 100%, rgba(255,42,109,.12), transparent 60%), var(--bg); background-attachment:fixed; }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:50; opacity:.3; mix-blend-mode:overlay; background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px); }
  h2, h3, .views a, .steps button, .kinds button { font-family:var(--px); font-weight:400; letter-spacing:.05em; }
  h2 { font-size:17px; } h3 { font-size:13px; color:var(--muted); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--line); } ::-webkit-scrollbar-track { background:transparent; }
  a { color:inherit; }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:7px 13px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  .btnlike { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:5px 11px; cursor:pointer; font-size:13px; }
  .btnlike:hover { border-color:var(--accent); }
  .chips { gap:6px; margin-top:4px; } .chip { padding:4px 12px; border-radius:999px; font-size:13px; } .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .lbl { display:block; }
  .ratios { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; } .ratio { flex:1 1 60px; }
  .ratio { background:transparent; border-radius:10px; padding:7px 8px 5px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:64px; }
  .ratio i { display:block; border:2px solid var(--muted); border-radius:2px; }

  #nb { flex:none; }

  ul.kinds li { display:flex; gap:6px; } ul.kinds b { color:var(--accent); }
  .examrow { margin:14px 0; } .examrow .thumbs img { width:120px; }
  button:disabled { opacity:.45; cursor:default; }
  button.go { background:linear-gradient(90deg, var(--accent), var(--pink)); color:#fff; border:0; font-family:var(--px); letter-spacing:.06em; box-shadow:0 0 18px var(--glow); }
  button.go:hover:not(:disabled) { filter:brightness(1.1); }
  button.danger { color:#ff9aa8; }
  .hl { position:relative; background:var(--panel); border-radius:8px; }
  .hl .hlb { position:absolute; inset:0; padding:8px 10px; border:1px solid transparent; white-space:pre-wrap; overflow-wrap:break-word; overflow:hidden; pointer-events:none; color:var(--text); }
  .hl .hlb mark { background:none; color:var(--cyan); }
  .hl textarea { position:relative; background:transparent; color:transparent; caret-color:var(--text); }
  .hl textarea::selection { background:var(--glow); color:transparent; }
  input[type=range] { accent-color:var(--accent); }
  input, textarea, select { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:16px; letter-spacing:.02em; }
  body.embedded > header { display:none; }
  .views { display:flex; padding:3px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .views a { padding:5px 12px; border-radius:7px; color:var(--muted); font-size:14px; text-decoration:none; }
  .views a:hover { color:var(--text); }

  main { max-width:1500px; margin:0 auto; padding:18px 16px; }
  .head { display:flex; gap:16px; align-items:center; margin-bottom:22px; }
  .head img { width:96px; height:96px; border-radius:50%; border:2px solid var(--accent); object-fit:cover; flex:none; }
  .say { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; max-width:70ch; min-height:48px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,200px)); gap:14px; }
  #sets { grid-template-columns:repeat(auto-fill,minmax(150px,185px)); } /* one more set per row */
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; text-align:left; padding:0; }
  .tile img, .tile .blank { width:100%; aspect-ratio:2/3; object-fit:cover; display:grid; place-items:center; color:var(--muted); background:var(--raised); font-size:42px; }
  .tile .meta { padding:9px 11px; display:flex; flex-direction:column; gap:6px; }

  .steps { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; padding:0; list-style:none; }
  .steps li { padding:4px 11px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12.5px; }
  .steps li.on { border-color:var(--accent); color:var(--text); }
  .steps li.done { color:var(--ok); }
  .two { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; }
  @media (max-width:860px) { .two { grid-template-columns:1fr; } }
  .pics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .pics.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
  @media (max-width:640px) { .pics, .pics.four { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .pic { position:relative; background:var(--panel); border:2px solid var(--line); border-radius:10px; overflow:hidden; padding:0; display:block; width:100%; }
  .pic img { width:100%; display:block; }
  .judgenote { border-left:3px solid var(--cyan); padding-left:8px; } .judgenote.warn { border-color:var(--pink); color:var(--text); }
  .pic.keep { border-color:var(--ok); } .pic.drop { opacity:.45; } .pic.sel { border-color:var(--accent); }
  .pic .bar { display:flex; gap:6px; padding:6px; }
  .pic .bar button { flex:1; padding:4px 6px; }
  .pic .tags { width:100%; border:0; border-top:1px solid var(--line); border-radius:0; font-size:11.5px; min-height:50px; resize:vertical; }
  .chat { display:flex; flex-direction:column; gap:14px; height:calc(100vh - 530px); min-height:170px; overflow:auto; margin-bottom:12px; padding:6px 2px; }
  .chat p { margin:0; white-space:pre-wrap; align-self:flex-start; max-width:78%; }
  .chat p.user { align-self:flex-end; max-width:70%; padding:8px 14px; border:3px solid #e9e4ff; border-radius:7px; color:#f4f1ff; font:400 21px/1.22 var(--term); letter-spacing:.02em; text-shadow:2px 2px 0 #0b0820;
    background:linear-gradient(180deg, rgba(120,48,150,.92), rgba(62,22,92,.95)); box-shadow:0 0 0 2px #0b0820, inset 0 0 0 2px rgba(255,42,109,.55), 0 0 22px -8px var(--pink); }
  .stylemini { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px; } .stylemini figure { margin:0; width:132px; overflow:hidden; border:2px solid var(--line); border-radius:7px; background:var(--panel); }
  .stylemini img { width:100%; aspect-ratio:3/2; object-fit:cover; display:block; } .stylemini figcaption { padding:4px 7px; font:400 10.5px/1.2 var(--px); letter-spacing:.04em; }
  .chat p.working { padding:10px 14px; border:1px solid var(--line); border-radius:18px; background:var(--panel); color:var(--muted); }
  /* Yumeko speaks in the same 16-bit dialogue box as Dreamforge's host */

  .dlg-name, .dlg-box { position:relative; color:#f4f1ff; border:3px solid #e9e4ff; border-radius:7px;
    background:linear-gradient(180deg, rgba(64,52,168,.92), rgba(26,20,82,.94) 60%, rgba(18,12,58,.95));
    box-shadow:0 0 0 2px #0b0820, inset 0 0 0 2px color-mix(in srgb, var(--host-frame) 70%, transparent), 0 0 26px -8px var(--host-frame); }
  .dlg-name::after, .dlg-box::after { content:''; position:absolute; inset:0; border-radius:4px; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px); }
  .dlg-name { font:400 16px/1 'Silkscreen', monospace; letter-spacing:.06em; padding:8px 14px 7px; text-shadow:2px 2px 0 #0b0820; }
  .dlg-box { align-self:stretch; display:flex; gap:16px; align-items:flex-start; padding:12px 18px 14px 12px; }
  .dlg-face { flex:none; width:112px; aspect-ratio:1; overflow:hidden; border-radius:4px; background:#0b0820; box-shadow:0 0 0 2px rgba(233,228,255,.5), 0 0 0 4px #0b0820; }
  .dlg-face img { width:100%; height:100%; object-fit:cover; display:block; }
  .dlg-text, .chat .dlg-text { flex:1; min-width:0; max-width:none; color:#f4f1ff; margin:0; font:400 24px/1.22 'VT323', monospace; letter-spacing:.02em; text-shadow:2px 2px 0 #0b0820; }
  .dlg.past .dlg-name { display:none; } .dlg.past .dlg-face { width:52px; } .dlg.past .dlg-box { padding:8px 14px 8px 8px; gap:12px; } .dlg.past .dlg-text, .chat .dlg.past .dlg-text { font-size:20px; }
  @media (max-width:640px) { .dlg-face { width:72px; } .chat .dlg-text { font-size:20px; } }
  .pic.pending { aspect-ratio:2/3; border:2px dashed var(--line); background:var(--panel); animation:pendingpulse 1.6s ease-in-out infinite; }
  @keyframes pendingpulse { 50% { opacity:.45; } } @media (prefers-reduced-motion: reduce) { .pic.pending { animation:none; } }
  .gridthree { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .gridthree .pic { position:relative; padding:0; overflow:hidden; display:block; text-align:left; background:var(--panel); border:2px solid var(--line); transition:transform .18s ease, box-shadow .18s ease; transform-origin:top center; }
  .gridthree .pic:first-child { transform-origin:top left; } .gridthree .pic:last-child { transform-origin:top right; }
  .gridthree .pic:not(.pending):hover, .gridthree .pic:focus-visible { z-index:5; transform:scale(1.5); border-color:var(--accent); box-shadow:0 0 34px var(--glow), 0 18px 40px rgba(0,0,0,.7); }
  .gridthree .pic.sel { border-color:var(--accent); box-shadow:0 0 18px var(--glow); }
  .gridthree img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; } .gridthree .bar { padding:6px 9px; font:400 11px/1.2 var(--px); letter-spacing:.04em; }
  .promptlist { margin-top:6px; font-size:13px; } .promptlist summary { cursor:pointer; color:var(--muted); } .promptlist dd { word-break:break-word; }
  @media (max-width:640px) { .gridthree .pic:hover { transform:none; } } @media (prefers-reduced-motion: reduce) { .gridthree .pic { transition:none; } }
  .gridbar { display:flex; align-items:center; gap:12px; min-height:42px; margin-top:8px; }
  #over { width:min(420px,92vw); padding:22px; border:2px solid var(--pink); border-radius:8px; background:var(--panel); color:var(--text); } #over::backdrop { background:rgba(5,3,11,.75); }
  .chat > :first-child { margin-top:auto; }
  .openfull { position:absolute; top:8px; left:8px; width:30px; height:30px; display:grid; place-items:center; border:2px solid #fff; border-radius:6px; background:rgba(10,6,20,.6); color:#fff; font-size:17px; line-height:1; text-decoration:none; }
  .openfull:hover { background:var(--accent); }
  html, body { overflow-x:clip; }  /* clip, not hidden: hidden makes body a scroll box and breaks sticky headers */
  body.fixedpage { height:100vh; overflow:hidden; } body.fixedpage main { padding-top:12px; padding-bottom:0; }
  .gridthree { max-width:calc((100vh - 400px) * 2 + 24px); } .promptlist[open] { max-height:150px; overflow-y:auto; }
  body.fixedpage .stylemini:has(+ .design.has) { max-width:52%; margin-bottom:12px; } body.fixedpage .design.has { margin-top:0; }
  body.fixedpage .design.has > :last-child { margin-top:-125px; } body.fixedpage .design.has .chat { height:calc(100vh - 405px); }
  .compare { display:grid; grid-template-columns:repeat(3,min(calc((100vh - 245px) * .684), calc((100% - 32px) / 3))); justify-content:center; gap:16px; align-items:start; }
  .baseref { position:sticky; top:12px; margin:0; } .baseref button { display:block; width:100%; padding:0; border:2px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); cursor:zoom-in; }
  .baseref button:hover, .baseref button:focus-visible { border-color:var(--accent); } .baseref img { display:block; width:100%; height:auto; }
  .baseref figcaption { margin-top:6px; font:400 11px/1.2 var(--px); letter-spacing:.04em; color:var(--muted); text-align:center; }
  @media (max-width:900px) { .compare { grid-template-columns:1fr 1fr; } .compare #b { grid-column:1 / -1; grid-row:2; } .baseref { position:static; } }
  .swipe { min-width:0; text-align:center; } .shot { display:block; width:100%; padding:0; border:2px solid var(--accent); border-radius:8px; overflow:hidden; background:var(--panel); cursor:zoom-in; box-shadow:0 0 18px var(--glow); }
  .shot img { display:block; width:100%; height:auto; } .shotbox { position:relative; }
  .swipebar { position:absolute; left:0; right:0; bottom:16px; display:flex; justify-content:center; gap:28px; pointer-events:none; } .swipebar button { pointer-events:auto; width:68px; height:68px; padding:0; border-radius:50%; border:2px solid; background:rgba(10,6,20,.78); box-shadow:0 4px 16px rgba(0,0,0,.55); font-size:30px; line-height:1; cursor:pointer; }
  .nope { color:#ff6b81; border-color:#ff6b81; } .love { color:#ff3d9a; border-color:#ff3d9a; } .nope:hover { background:#ff6b81; color:#fff; } .love:hover { background:#ff3d9a; color:#fff; }
  .swipecount { margin-top:8px; } .swipedone { padding:40px 12px; }
  .settop { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px 16px; margin-bottom:14px; } .settop [hidden] { display:none !important; }
  .setsum { display:flex; align-items:baseline; gap:8px; color:var(--muted); font-size:13px; } .setsum strong { font:400 22px/1 var(--px); color:var(--text); } .setsum small { font-size:13px; color:var(--muted); }
  .setnow { margin:0; } .setacts { display:flex; align-items:center; gap:8px; } .setacts button { padding:8px 14px; } .setacts [aria-expanded="true"] { border-color:var(--accent); }
  .settrack { grid-column:1 / -1; display:flex; gap:4px; margin:0; padding:0; list-style:none; }
  .settrack li { position:relative; flex:1 0 auto; display:flex; justify-content:space-between; gap:6px; padding:7px 8px; overflow:hidden; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--muted); font:400 10px/1.2 var(--px); letter-spacing:.03em; }
  .settrack i { position:absolute; inset:0 auto 0 0; background:var(--accent); opacity:.35; } .settrack span, .settrack b { position:relative; font-weight:400; white-space:nowrap; } .settrack span { overflow:hidden; text-overflow:ellipsis; }
  .settrack .now { border-color:var(--accent); color:var(--text); box-shadow:0 0 10px var(--glow); } .settrack .done { color:var(--ok); border-color:var(--ok); } .settrack .done i { background:var(--ok); } .settrack .off { opacity:.4; border-style:dashed; }
  .settrack { flex-wrap:wrap; }
  .composerbox { display:flex; align-items:flex-end; gap:10px; padding:10px 10px 10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }

  .composerbox:focus-within { border-color:var(--accent); }

  .composerbox button { flex:none; width:42px; height:42px; padding:0; font-size:18px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .note { color:var(--muted); font-size:12.5px; }
  .err { color:#ff9aa8; margin:8px 0; }
  .busy { color:var(--accent); margin:8px 0; }
  .stagebusy { position:absolute; left:0; right:0; bottom:0; padding:18px 22px 16px; background:linear-gradient(transparent, rgba(8,4,16,.85) 35%); color:#fff; line-height:1.3; display:flex; flex-direction:column; gap:8px; pointer-events:none; z-index:3; }
  .stagebusy b { font-size:16px; } .stagebusy small { color:#cfc6e6; font-size:12px; }
  .stagebusy .bar { height:10px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; } .stagebusy .bar i { display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--cyan)); transition:width .8s ease; }
  .stagebusy .bar.wait i { width:100% !important; opacity:.5; animation:busyPulse 1.4s ease-in-out infinite; } @keyframes busyPulse { 50% { opacity:.15; } }
  @media (prefers-reduced-motion:reduce) { .stagebusy .bar i { transition:none; } .stagebusy .bar.wait i { animation:none; } }
  .meter { height:10px; border-radius:6px; background:var(--raised); overflow:hidden; margin:8px 0; }
  .meter i { display:block; height:100%; background:var(--accent); }
  .bal { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:2px 14px; font-size:12px; color:var(--muted); }
  .sugg { position:relative; } .sugg:focus-within { z-index:40; }

  .sugg > ul li { padding:4px 8px; cursor:pointer; border-radius:6px; } .sugg > ul li:hover { background:var(--panel); }
  .jobtop { display:flex; gap:14px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .jobtop img { width:52px; height:52px; border-radius:50%; object-fit:cover; object-position:top; border:2px solid var(--accent); flex:none; }
  .jobtop .dlg { flex:1 1 300px; min-width:0; }

  main > .dlg { margin-bottom:22px; }
  .jobtop h2 { margin:0; } .jobtop .steps { margin:0 0 0 auto; } .jobtop .say { padding:7px 12px; min-height:0; flex:1 1 260px; font-size:13px; }
  .steps li { padding:0; border:0; } .steps button { padding:4px 11px; border-radius:999px; font-size:12.5px; background:transparent; color:var(--muted); }
  .steps li.done button { color:var(--ok); } .steps li.now button { border-color:var(--accent); color:var(--text); }
  .steps li.on button { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .review { display:grid; grid-template-columns:minmax(260px,420px) minmax(0,1fr); gap:22px; }
  .review img { width:100%; border-radius:10px; display:block; }
  @media (max-width:860px) { .review { grid-template-columns:1fr; } }
  .exact { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; white-space:pre-wrap; word-break:break-word; font-size:12.5px; margin:0 0 4px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:12.5px; margin:0 0 12px; } .kv dt { color:var(--muted); } .kv dd { margin:0; }
  dialog.rp { width:min(96vw, calc((94vh - 120px) * .85 + 60px)); max-width:none; height:94vh; max-height:94vh; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--panel); color:var(--text); }
  dialog.rp[open] { display:flex; flex-direction:column; gap:10px; } dialog.rp::backdrop { background:rgba(8,6,20,.7); }
  dialog.rp .rpg { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; overflow:auto; min-height:120px; flex:1 1 auto; align-content:start; grid-auto-rows:calc((94vh - 120px) / 3); }

// Pills write their tags visibly: [positive, negative] go into / come out of the Quality and Negative fields.
function pillTags(f, pair, on, keys = ['quality', 'negative'], first = false) {
